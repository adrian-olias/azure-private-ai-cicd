name: build and deploy

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - "services/**"
      - "docker-compose*.yml"
      - ".github/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for azure/login
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      project: ${{ steps.target.outputs.project }}
      tags: ${{ steps.build.outputs.tags }}
    steps:
      # The PR head, with history: each service is tagged with the last commit that changed it
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Pick the environment from the branches
        id: target
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          if [[ "$ACTION" == "closed" && "$MERGED" != "true" ]]; then
            echo "::notice::PR closed without merge. Nothing to do."
          elif [[ "$BASE" == "dev" && "$HEAD" == feature/* ]]; then
            printf 'environment=Dev\nproject=privateai-dev\nprefix=dev\n' >> "$GITHUB_OUTPUT"
          elif [[ "$BASE" == "main" && "$HEAD" == "dev" ]]; then
            printf 'environment=Production\nproject=privateai-prod\nprefix=release\n' >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$HEAD -> $BASE is not a promotion path (feature/* -> dev, dev -> main). Nothing to do."
          fi

      - name: Azure login (OIDC)
        if: steps.target.outputs.environment != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: docker/setup-buildx-action@v4
        if: steps.target.outputs.environment != ''

      # Each service is tagged <prefix>-<last commit that changed services/<name>/>, so its tag only
      # changes when its folder changes. A service is built and pushed only when its tag is not in
      # ACR yet: a PR that touches one service builds one image. On merge, nothing is usually missing.
      - name: Build and push the services that changed
        id: build
        if: steps.target.outputs.environment != ''
        env:
          PREFIX: ${{ steps.target.outputs.prefix }}
          ACR: ${{ vars.ACR_NAME }}
        run: |
          az acr login --name "$ACR"
          tags='{}'
          for dir in services/*/; do
            service="$(basename "$dir")"
            sha="$(git log -1 --format=%H -- "$dir")"
            tag="${PREFIX}-${sha:0:7}"
            image="$ACR.azurecr.io/$service"
            tags="$(jq -c --arg s "$service" --arg t "$tag" '. + {($s): $t}' <<<"$tags")"

            if az acr repository show --name "$ACR" --image "$service:$tag" --output none 2>/dev/null; then
              echo "::notice::$service:$tag is already in ACR: no build"
              continue
            fi
            echo "::group::build and push $service:$tag"
            docker buildx build "$dir" --push --provenance=false \
              --tag "$image:$tag" \
              --cache-from "type=registry,ref=$image:buildcache" \
              --cache-to "type=registry,ref=$image:buildcache,mode=max"
            echo "::endgroup::"
          done
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy ${{ needs.build-and-push.outputs.environment }}
    needs: build-and-push
    # Only on merge. The images were built and pushed while the PR was open
    if: >-
      needs.build-and-push.outputs.environment != '' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: ${{ needs.build-and-push.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      MODEL: ${{ vars.CUSTOM_MODEL_ID || 'private-ai' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The script carries the compose files and the settings, never a secret:
      # the VM reads the secrets from Key Vault itself
      - name: Write the deploy script
        env:
          PROJECT: ${{ needs.build-and-push.outputs.project }}
          TAGS: ${{ needs.build-and-push.outputs.tags }}
          ACR: ${{ vars.ACR_NAME }}
          KEY_VAULT: ${{ vars.KEY_VAULT_NAME }}
          AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
          WEBUI_ADMIN_EMAIL: ${{ vars.WEBUI_ADMIN_EMAIL }}
          # Optional settings. Empty ones fall back to the defaults in docker-compose.yml
          WEBUI_NAME: ${{ vars.WEBUI_NAME }}
          CUSTOM_MODEL_NAME: ${{ vars.CUSTOM_MODEL_NAME }}
          KNOWLEDGE_BASE_NAME: ${{ vars.KNOWLEDGE_BASE_NAME }}
          BASE_MODEL: ${{ vars.BASE_MODEL }}
          OLLAMA_MODELS: ${{ vars.OLLAMA_MODELS }}
          SYNC_INTERVAL_MINUTES: ${{ vars.SYNC_INTERVAL_MINUTES }}
        run: |
          {
            echo "ACR_REGISTRY=$ACR.azurecr.io"
            # One tag per service: docs-sync -> DOCS_SYNC_TAG=dev-1a2b3c4
            jq -r 'to_entries[] | "\(.key | ascii_upcase | gsub("-"; "_"))_TAG=\(.value)"' <<<"$TAGS"
            echo "AZURE_STORAGE_ACCOUNT=$AZURE_STORAGE_ACCOUNT"
            echo "WEBUI_ADMIN_EMAIL=$WEBUI_ADMIN_EMAIL"
            echo "CUSTOM_MODEL_ID=$MODEL"
            for name in WEBUI_NAME CUSTOM_MODEL_NAME KNOWLEDGE_BASE_NAME BASE_MODEL OLLAMA_MODELS SYNC_INTERVAL_MINUTES; do
              if [[ -n "${!name}" ]]; then echo "$name=${!name}"; fi
            done
          } > settings.env

          {
            echo "PROJECT='$PROJECT' ACR='$ACR' KEY_VAULT='$KEY_VAULT' MODEL='$MODEL'"
            echo "COMPOSE_B64='$(base64 -w0 docker-compose.yml)'"
            echo "SETTINGS_B64='$(base64 -w0 settings.env)'"
            cat <<'SCRIPT'
          # ---- runs on the VM, as root ----
          set -euo pipefail
          # cloud-init installs Docker and the Azure CLI when the VM is created: wait for it
          cloud-init status --wait > /dev/null || true
          dir="/opt/$PROJECT"
          mkdir -p "$dir" && cd "$dir"
          base64 -d <<<"$COMPOSE_B64" > docker-compose.yml

          # The VM's managed identity: AcrPull on the registry, Secrets User on Key Vault
          az login --identity --output none
          az acr login --name "$ACR" --output none
          secret() { az keyvault secret show --vault-name "$KEY_VAULT" --name "$1" --query value -o tsv; }
          admin_password="$(secret webui-admin-password)"

          umask 077
          trap 'rm -f .env' EXIT # the secrets never stay on disk
          {
            base64 -d <<<"$SETTINGS_B64"
            echo "WEBUI_SECRET_KEY=$(secret webui-secret-key)"
            echo "WEBUI_ADMIN_PASSWORD=$admin_password"
          } > .env

          docker compose -p "$PROJECT" pull --quiet
          docker compose -p "$PROJECT" up -d --remove-orphans

          # The one-off setup job must finish cleanly. docker wait also works once it has stopped
          bootstrap="$(docker compose -p "$PROJECT" ps -a -q webui-bootstrap)"
          if [[ "$(docker wait "$bootstrap")" != "0" ]]; then
            docker compose -p "$PROJECT" logs --tail 30 webui-bootstrap
            exit 1
          fi
          docker compose -p "$PROJECT" ps --format '{{.Service}}: {{.Status}}'

          # Smoke test: sign in and ask the custom model a question through the API
          url="http://127.0.0.1:3000"
          email="$(grep '^WEBUI_ADMIN_EMAIL=' .env | cut -d= -f2-)"
          token="$(curl -fsS -X POST "$url/api/v1/auths/signin" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg e "$email" --arg p "$admin_password" '{email: $e, password: $p}')" | jq -r .token)"
          answer="$(curl -fsS --max-time 300 -X POST "$url/api/chat/completions" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg m "$MODEL" '{model: $m, stream: false, messages: [{role: "user", content: "In one sentence, what can you help me with?"}]}')" \
            | jq -r '.choices[0].message.content // empty' | tr '\n' ' ')"
          [[ -n "$answer" ]] || { echo "The model did not answer"; exit 1; }

          docker image prune --all --force --filter "until=72h" > /dev/null
          echo "ANSWER: $answer"
          echo "DEPLOY_OK"
          SCRIPT
          } > deploy.sh

      # run-command returns the script's output but not its exit code, so success is a marker line
      - name: Deploy with az vm run-command
        env:
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          VM_NAME: ${{ vars.VM_NAME }}
        run: |
          output="$(az vm run-command invoke -g "$RESOURCE_GROUP" -n "$VM_NAME" \
            --command-id RunShellScript --scripts @deploy.sh --query 'value[0].message' -o tsv)"
          echo "$output"

          if ! grep -q '^DEPLOY_OK$' <<<"$output"; then
            echo "::error::The deploy failed on $VM_NAME. Its output is above."
            exit 1
          fi
          {
            echo "### $MODEL answered on $VM_NAME"
            echo "> $(grep '^ANSWER: ' <<<"$output" | cut -d' ' -f2-)"
          } >> "$GITHUB_STEP_SUMMARY"
