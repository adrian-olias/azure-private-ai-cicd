name: AI Platform Build and Deploy

# Portfolio note: This CI/CD pipeline triggers matrix builds to push the 3 
# microservice images parallelly, then deploys the 8-container stack to 
# self-hosted runners on Azure VMs (Dev or Prod).

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
      - "services/**"
      - "docker-compose.yml"
      - ".github/workflows/build_and_push.yml"

jobs:
  # ===========================================================================
  # 1. BUILD & PUSH (Runs while the PR is OPEN)
  #    Matrix strategy: builds multiple images concurrently.
  # ===========================================================================
  build-and-push:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged != true &&
      (
        (github.event.pull_request.base.ref == 'dev' && startsWith(github.head_ref, 'feature/')) ||
        (github.event.pull_request.base.ref == 'main' && github.head_ref == 'dev')
      )
    runs-on: ubuntu-latest
    name: Build ${{ matrix.service }}
    environment: ${{ github.event.pull_request.base.ref == 'main' && 'Production' || 'Dev' }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - storage-sync
          - rag-ingestor
          - webui-bootstrap
    env:
      ACR_REGISTRY: ${{ vars.ACR_LOGIN_SERVER }} 
      ACR_REPOSITORY: ${{ matrix.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: get-short-sha
        run: |
          PR_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA=${PR_SHA:0:7}
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine TAG (Immutable tags)
        id: get-tag
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          SHORT_SHA: ${{ steps.get-short-sha.outputs.SHORT_SHA }}
        run: |
          if [[ "$PR_BASE_REF" == "dev" ]]; then
            TAG=dev-${SHORT_SHA}
          elif [[ "$PR_BASE_REF" == "main" ]]; then
            TAG=release-${SHORT_SHA}
          fi
          echo "Tag -> $TAG"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          file: ./services/${{ matrix.service }}/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}:${{ steps.get-tag.outputs.TAG }}
          cache-from: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.ACR_REPOSITORY }}:buildcache,mode=max

  # ===========================================================================
  # 2. DEPLOY TO DEV (Upon Merge: feature/* -> dev)
  # ===========================================================================
  deploy-dev:
    name: Deploy AI Platform (DEV)
    needs: [build-and-push]
    if: >
      !cancelled() &&
      needs.build-and-push.result != 'failure' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'dev' &&
      startsWith(github.head_ref, 'feature/')
    runs-on: [self-hosted, dev-vm]
    environment: Dev
    env:
      ACR_REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
      ACR_REPOSITORIES: "storage-sync rag-ingestor webui-bootstrap"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Deploy Stack via Docker Compose
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # ─── Secrets ───────────────────────────────────────────────────
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          WEBUI_ADMIN_PASSWORD: ${{ secrets.WEBUI_ADMIN_PASSWORD }}
          WEBUI_SECRET_KEY: ${{ secrets.WEBUI_SECRET_KEY }}
          # ─── Client identity (Environment Vars) ─────────────────────────
          WEBUI_NAME: ${{ vars.WEBUI_NAME }}
          WEBUI_ADMIN_EMAIL: ${{ vars.WEBUI_ADMIN_EMAIL }}
          WEBUI_ADMIN_NAME: ${{ vars.WEBUI_ADMIN_NAME }}
          DEFAULT_LOCALE: ${{ vars.DEFAULT_LOCALE }}
          CUSTOM_MODEL_NAME: ${{ vars.CUSTOM_MODEL_NAME }}
          CUSTOM_MODEL_ID: ${{ vars.CUSTOM_MODEL_ID }}
          KNOWLEDGE_BASE_NAME: ${{ vars.KNOWLEDGE_BASE_NAME }}
          # ─── Azure Storage ─────────────────────────────────────────────
          AZURE_DOCS_CONTAINER: ${{ vars.AZURE_DOCS_CONTAINER }}
          AZURE_CONFIG_CONTAINER: ${{ vars.AZURE_CONFIG_CONTAINER }}
          # ─── AI Engine ─────────────────────────────────────────────────
          DEFAULT_MODELS: ${{ vars.DEFAULT_MODELS }}
          OLLAMA_PULL_MODELS: ${{ vars.OLLAMA_PULL_MODELS }}
          # ─── RAG Specs ─────────────────────────────────────────────────
          RAG_EMBEDDING_MODEL: ${{ vars.RAG_EMBEDDING_MODEL }}
          RAG_TOP_K: ${{ vars.RAG_TOP_K }}
          CHUNK_SIZE: ${{ vars.CHUNK_SIZE }}
          CHUNK_OVERLAP: ${{ vars.CHUNK_OVERLAP }}
          ENABLE_WEB_SEARCH: ${{ vars.ENABLE_WEB_SEARCH }}
          # ─── Intervals ─────────────────────────────────────────────────
          SYNC_INTERVAL_MINUTES: ${{ vars.SYNC_INTERVAL_MINUTES }}
          INGEST_INTERVAL_MINUTES: ${{ vars.INGEST_INTERVAL_MINUTES }}
        run: |
          SHORT_SHA=${PR_HEAD_SHA:0:7}
          TARGET_TAG="dev-${SHORT_SHA}"
          echo "🚀 Deploying to DEV with Tag: $TARGET_TAG"

          # Generate dynamic .env file.
          # Variables not populated by the Environment fallback to internal defaults.
          umask 077
          cat > .env <<EOF
          ACR_REGISTRY=${{ env.ACR_REGISTRY }}
          SYNC_IMAGE_TAG=${TARGET_TAG}

          AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
          AZURE_DOCS_CONTAINER=${AZURE_DOCS_CONTAINER:-documents}
          AZURE_CONFIG_CONTAINER=${AZURE_CONFIG_CONTAINER:-config}

          CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

          WEBUI_PORT=3000
          WEBUI_NAME=${WEBUI_NAME:-Corporate AI}
          WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
          DEFAULT_LOCALE=${DEFAULT_LOCALE:-en-US}

          WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL}
          WEBUI_ADMIN_PASSWORD=${WEBUI_ADMIN_PASSWORD}
          WEBUI_ADMIN_NAME=${WEBUI_ADMIN_NAME:-Admin}

          CUSTOM_MODEL_NAME=${CUSTOM_MODEL_NAME:-Corporate AI}
          CUSTOM_MODEL_ID=${CUSTOM_MODEL_ID:-corporate-ai}
          KNOWLEDGE_BASE_NAME=${KNOWLEDGE_BASE_NAME:-Company Docs}

          DEFAULT_MODELS=${DEFAULT_MODELS:-llama3.1:latest}
          OLLAMA_PULL_MODELS=${OLLAMA_PULL_MODELS:-${DEFAULT_MODELS:-llama3.1:latest}}

          RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
          RAG_TOP_K=${RAG_TOP_K:-5}
          CHUNK_SIZE=${CHUNK_SIZE:-1000}
          CHUNK_OVERLAP=${CHUNK_OVERLAP:-100}
          ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:-false}

          SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-15}
          INGEST_INTERVAL_MINUTES=${INGEST_INTERVAL_MINUTES:-15}
          EOF

          # Recreate the stack pulling the new images
          docker compose --env-file .env -p dev-ia-platform pull
          docker compose --env-file .env -p dev-ia-platform down
          docker compose --env-file .env -p dev-ia-platform up -d

          echo "⏳ Tailing bootstrap job logs..."
          docker compose --env-file .env -p dev-ia-platform logs --tail 40 webui-bootstrap || true
          docker compose --env-file .env -p dev-ia-platform ps

      - name: Clean old Docker images safely
        run: |
          echo "🧹 Cleaning up stale images..."
          USED_IMAGES=$(docker ps --format '{{.Image}}' | sort | uniq)
          for REPO in ${{ env.ACR_REPOSITORIES }}; do
            docker images --format '{{.Repository}}:{{.Tag}}' | grep "$REPO" | while read IMG; do
              if ! echo "$USED_IMAGES" | grep -qF "$IMG"; then
                echo "Removing unused image: $IMG"
                docker rmi "$IMG" || true
              fi
            done
          done

  # ===========================================================================
  # 3. DEPLOY TO MAIN / PROD (Upon Merge: dev -> main)
  # ===========================================================================
  deploy-main:
    name: Deploy AI Platform (PROD)
    needs: [build-and-push]
    if: >
      !cancelled() &&
      needs.build-and-push.result != 'failure' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.head_ref == 'dev'
    runs-on: [self-hosted, prod-vm]
    environment: Production
    env:
      ACR_REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
      ACR_REPOSITORIES: "storage-sync rag-ingestor webui-bootstrap"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Deploy Stack via Docker Compose
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          WEBUI_ADMIN_PASSWORD: ${{ secrets.WEBUI_ADMIN_PASSWORD }}
          WEBUI_SECRET_KEY: ${{ secrets.WEBUI_SECRET_KEY }}
          WEBUI_NAME: ${{ vars.WEBUI_NAME }}
          WEBUI_ADMIN_EMAIL: ${{ vars.WEBUI_ADMIN_EMAIL }}
          WEBUI_ADMIN_NAME: ${{ vars.WEBUI_ADMIN_NAME }}
          DEFAULT_LOCALE: ${{ vars.DEFAULT_LOCALE }}
          CUSTOM_MODEL_NAME: ${{ vars.CUSTOM_MODEL_NAME }}
          CUSTOM_MODEL_ID: ${{ vars.CUSTOM_MODEL_ID }}
          KNOWLEDGE_BASE_NAME: ${{ vars.KNOWLEDGE_BASE_NAME }}
          AZURE_DOCS_CONTAINER: ${{ vars.AZURE_DOCS_CONTAINER }}
          AZURE_CONFIG_CONTAINER: ${{ vars.AZURE_CONFIG_CONTAINER }}
          DEFAULT_MODELS: ${{ vars.DEFAULT_MODELS }}
          OLLAMA_PULL_MODELS: ${{ vars.OLLAMA_PULL_MODELS }}
          RAG_EMBEDDING_MODEL: ${{ vars.RAG_EMBEDDING_MODEL }}
          RAG_TOP_K: ${{ vars.RAG_TOP_K }}
          CHUNK_SIZE: ${{ vars.CHUNK_SIZE }}
          CHUNK_OVERLAP: ${{ vars.CHUNK_OVERLAP }}
          ENABLE_WEB_SEARCH: ${{ vars.ENABLE_WEB_SEARCH }}
          SYNC_INTERVAL_MINUTES: ${{ vars.SYNC_INTERVAL_MINUTES }}
          INGEST_INTERVAL_MINUTES: ${{ vars.INGEST_INTERVAL_MINUTES }}
        run: |
          SHORT_SHA=${PR_HEAD_SHA:0:7}
          TARGET_TAG="release-${SHORT_SHA}"
          echo "🚀 Deploying to PROD with Tag: $TARGET_TAG"

          umask 077
          cat > .env <<EOF
          ACR_REGISTRY=${{ env.ACR_REGISTRY }}
          SYNC_IMAGE_TAG=${TARGET_TAG}

          AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING}
          AZURE_DOCS_CONTAINER=${AZURE_DOCS_CONTAINER:-documents}
          AZURE_CONFIG_CONTAINER=${AZURE_CONFIG_CONTAINER:-config}

          CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

          WEBUI_PORT=3000
          WEBUI_NAME=${WEBUI_NAME:-Corporate AI}
          WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
          DEFAULT_LOCALE=${DEFAULT_LOCALE:-en-US}

          WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL}
          WEBUI_ADMIN_PASSWORD=${WEBUI_ADMIN_PASSWORD}
          WEBUI_ADMIN_NAME=${WEBUI_ADMIN_NAME:-Admin}

          CUSTOM_MODEL_NAME=${CUSTOM_MODEL_NAME:-Corporate AI}
          CUSTOM_MODEL_ID=${CUSTOM_MODEL_ID:-corporate-ai}
          KNOWLEDGE_BASE_NAME=${KNOWLEDGE_BASE_NAME:-Company Docs}

          DEFAULT_MODELS=${DEFAULT_MODELS:-llama3.1:latest}
          OLLAMA_PULL_MODELS=${OLLAMA_PULL_MODELS:-${DEFAULT_MODELS:-llama3.1:latest}}

          RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
          RAG_TOP_K=${RAG_TOP_K:-5}
          CHUNK_SIZE=${CHUNK_SIZE:-1000}
          CHUNK_OVERLAP=${CHUNK_OVERLAP:-100}
          ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:-false}

          SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES:-15}
          INGEST_INTERVAL_MINUTES=${INGEST_INTERVAL_MINUTES:-15}
          EOF

          docker compose --env-file .env -p prod-ia-platform pull
          docker compose --env-file .env -p prod-ia-platform down
          docker compose --env-file .env -p prod-ia-platform up -d

          echo "⏳ Tailing bootstrap job logs..."
          docker compose --env-file .env -p prod-ia-platform logs --tail 40 webui-bootstrap || true
          docker compose --env-file .env -p prod-ia-platform ps

      - name: Clean old Docker images safely
        run: |
          echo "🧹 Cleaning up stale images..."
          USED_IMAGES=$(docker ps --format '{{.Image}}' | sort | uniq)
          for REPO in ${{ env.ACR_REPOSITORIES }}; do
            docker images --format '{{.Repository}}:{{.Tag}}' | grep "$REPO" | while read IMG; do
              if ! echo "$USED_IMAGES" | grep -qF "$IMG"; then
                echo "Removing unused image: $IMG"
                docker rmi "$IMG" || true
              fi
            done
          done
