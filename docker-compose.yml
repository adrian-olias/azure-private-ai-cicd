services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:?}
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10

  ollama-puller:
    image: ollama/ollama:${OLLAMA_VERSION:?}
    restart: on-failure:3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for model in $$(echo "$$MODELS" | tr ',' ' '); do
          ollama pull "$$model" || exit 1
        done
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODELS: ${OLLAMA_MODELS:?}
    depends_on:
      ollama:
        condition: service_healthy

  open-webui:
    image: ghcr.io/open-webui/open-webui:${OPEN_WEBUI_VERSION:?}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPEN_WEBUI_PORT:?}:8080"
    volumes:
      - openwebui_data:/app/backend/data
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_NAME: ${WEBUI_NAME:?}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?}
      DEFAULT_MODELS: ${CUSTOM_MODEL_ID:?}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:?}
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:?} 
      ENABLE_WEB_SEARCH: ${ENABLE_WEB_SEARCH:?}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:?}
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  webui-bootstrap:
    image: ${ACR_REGISTRY:?}/webui-bootstrap:${WEBUI_BOOTSTRAP_TAG:?}
    restart: on-failure:5
    environment:
      OPEN_WEBUI_URL: http://open-webui:8080
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:?}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?}
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:?}
      BASE_MODEL_ID: ${BASE_MODEL:?}
      CUSTOM_MODEL_ID: ${CUSTOM_MODEL_ID:?}
      CUSTOM_MODEL_NAME: ${CUSTOM_MODEL_NAME:?}
      KNOWLEDGE_BASE_NAME: ${KNOWLEDGE_BASE_NAME:?}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT:-} # optional: empty means the built-in prompt
    depends_on:
      open-webui:
        condition: service_healthy
      ollama-puller:
        condition: service_completed_successfully

  docs-sync:
    image: ${ACR_REGISTRY:?}/docs-sync:${DOCS_SYNC_TAG:?}
    restart: unless-stopped
    volumes:
      - docs_sync_state:/data/state
    environment:
      AZURE_STORAGE_ACCOUNT: ${AZURE_STORAGE_ACCOUNT:?}
      AZURE_DOCS_CONTAINER: ${AZURE_DOCS_CONTAINER:?}
      OPEN_WEBUI_URL: http://open-webui:8080
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:?}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:?}
      KNOWLEDGE_BASE_NAME: ${KNOWLEDGE_BASE_NAME:?}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:?}
    depends_on:
      webui-bootstrap:
        condition: service_completed_successfully

volumes:
  ollama_data:
  openwebui_data:
  docs_sync_state:
